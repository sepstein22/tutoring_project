[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faced-pipeline"
dynamic = ["version"]
description = "A reliable pipeline for the FACED affective EEG dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["EEG", "affective computing", "FACED", "cross-validation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]

# Core: everything faced/ imports at module level. The package imports and the
# full ridge / elastic-net / forest / SVR path runs with only these.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

# The remaining imports are function-local, so each is genuinely optional and
# the feature that needs it fails with a clear ImportError rather than at
# import time. See README for which capability each one unlocks.
[project.optional-dependencies]
topomap = ["mne>=1.5"]                # features.montage_positions
cnn = ["tensorflow>=2.13"]            # models.CNN
excel = ["openpyxl>=3.1"]             # data.load_rating_layout, load_electrodes
figures = ["matplotlib>=3.7"]         # make_figures.py, run_all.py plots
download = ["synapseclient>=4.0"]     # fetch_faced.py
test = ["pytest>=7.4"]
all = [
    "mne>=1.5",
    "tensorflow>=2.13",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "synapseclient>=4.0",
    "pytest>=7.4",
]

[project.urls]
dataset = "https://doi.org/10.7303/syn50614194"
paper = "https://www.nature.com/articles/s41597-023-02650-w"

[tool.setuptools]
packages = ["faced"]

# One source of truth for the version: faced/__init__.py
[tool.setuptools.dynamic]
version = { attr = "faced.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Convergence warnings from elastic net on small synthetic folds are
    # expected and not a defect in the pipeline.
    "ignore::UserWarning:sklearn.linear_model._coordinate_descent",
]

